<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Pulse</title>
    <script>
      // Redirect GitHub Pages 404s to HashRouter route
      var path = window.location.pathname;
      if (!path.startsWith('/Campus-Pulse')) {
        window.location.replace('/Campus-Pulse/#/feed');
      } else {
        var segment = path.replace('/Campus-Pulse', '').replace(/^\/+/, '');
        var route = segment && !segment.includes('.') ? '#/' + segment : '#/feed';
        window.location.replace('/Campus-Pulse/' + route);
      }
    </script>
  </head>
  <body>
    <p>Redirecting to Campus Pulse...</p>
  </body>
</html>
