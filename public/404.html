<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Pulse</title>
    <script>
      // Redirect GitHub Pages 404s to HashRouter route
      var segment = window.location.pathname.split('/').pop();
      var hashRoute = segment && segment !== 'Campus-Pulse' ? '#/' + segment : '#/feed';
      window.location.replace('/Campus-Pulse/' + hashRoute);
    </script>
  </head>
  <body>
    <p>Redirecting to Campus Pulse...</p>
  </body>
</html>
