<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Pulse</title>
    <script>
      // Redirect GitHub Pages 404s to HashRouter route
      var l = window.location;
      var path = l.pathname;
      if (!path.endsWith('/')) {
        var parts = path.split('/');
        var last = parts.pop();
        if (last.includes('.')) {
          path = parts.join('/') + '/';
        } else {
          path = path + '/';
        }
      }
      l.replace(l.origin + path + '#/feed');
    </script>
  </head>
  <body>
    <p>Redirecting to Campus Pulse...</p>
  </body>
</html>
