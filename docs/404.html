<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Pulse</title>
    <script>
      // Redirect GitHub Pages 404s to HashRouter route
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var lastSegment = pathSegments[pathSegments.length - 1] || '';
      var hashRoute = (lastSegment && lastSegment !== 'Campus-Pulse' && !lastSegment.includes('.')) ? '#/' + lastSegment : '#/feed';
      var baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
      window.location.replace(baseUrl + hashRoute);
    </script>
  </head>
  <body>
    <p>Redirecting to Campus Pulse...</p>
  </body>
</html>
